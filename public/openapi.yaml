openapi: 3.1.0
info:
  title: Orbit Merchant API
  version: 0.1.0
  description: >
    Off-chain companion to the Orbit Soroban contract. Stores plans and
    subscriptions in Supabase and submits merchant-signed `pull_funds`
    transactions to Stellar Testnet.
servers:
  - url: http://localhost:3001
    description: Self-hosted (apps/backend)
tags:
  - name: Plans
  - name: Subscriptions
  - name: Billing
paths:
  /plans:
    post:
      tags: [Plans]
      summary: Create a plan
      description: Creates a recurring plan owned by a merchant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [merchant_id, name, usdc_amount, interval_seconds]
              properties:
                merchant_id:
                  type: string
                  format: uuid
                name:
                  type: string
                  minLength: 1
                  description: Cannot be empty or only spaces.
                  example: Pro Monthly
                usdc_amount:
                  type: integer
                  exclusiveMinimum: 0
                  description: Raw token units (7 decimals). 290000000 = 29 USDC.
                  example: 290000000
                interval_seconds:
                  type: integer
                  minimum: 1
                  description: Minimum gap between pulls, in seconds.
                  example: 2592000
      responses:
        '201':
          description: Plan created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Plan created successfully
                  plan:
                    $ref: '#/components/schemas/Plan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  /plans/{id}:
    get:
      tags: [Plans]
      summary: Retrieve a plan
      description: Returns a plan with its merchant's name and wallet address. Used by checkout.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Plan found
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan:
                    allOf:
                      - $ref: '#/components/schemas/Plan'
                      - type: object
                        properties:
                          merchants:
                            type: object
                            properties:
                              name:
                                type: string
                              wallet_address:
                                type: string
                                example: GBXQ4T7W91LK3PMZ0VR82C5E7NDF6U9H4YJ2A8S
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/PlanNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /subscriptions:
    post:
      tags: [Subscriptions]
      summary: Record a subscription
      description: >
        Records a subscription after the subscriber has completed `approve` and
        `create_vault` on-chain. Sets `next_billing_date` to now so the first
        cycle can be pulled right away. A wallet can subscribe to a plan only once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id, customer_wallet_address]
              properties:
                plan_id:
                  type: string
                  format: uuid
                customer_wallet_address:
                  type: string
                  pattern: '^G[A-Z2-7]{55}$'
                  description: Subscriber's Stellar account (G...). Must be a valid Ed25519 public key.
      responses:
        '201':
          description: Subscription created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Subscription created
                  subscription:
                    $ref: '#/components/schemas/Subscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/PlanNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /subscribers:
    get:
      tags: [Subscriptions]
      summary: List subscribers
      description: Lists subscriptions across every plan owned by a merchant.
      parameters:
        - name: merchant_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Subscriber list
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscribers:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Subscription'
                        - type: object
                          properties:
                            plans:
                              type: object
                              properties:
                                merchant_id:
                                  type: string
                                name:
                                  type: string
                                usdc_amount:
                                  type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  /trigger-pull:
    post:
      tags: [Billing]
      summary: Pull a billing cycle
      description: >
        Builds a `pull_funds(user, merchant)` invocation, simulates it with
        `prepareTransaction`, signs it with the merchant key, and submits it to
        Soroban Testnet. Once the transaction is confirmed, `next_billing_date`
        is set to the pull time plus the plan's `interval_seconds`.
        TESTNET ONLY: the merchant secret travels in the request body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscription_id, merchant_secret]
              properties:
                subscription_id:
                  type: string
                  format: uuid
                merchant_secret:
                  type: string
                  minLength: 1
                  description: >
                    Merchant's Stellar secret seed (S...). Must be a valid
                    Stellar secret key and match the plan owner's wallet.
      responses:
        '200':
          description: Transaction confirmed on-chain
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Successfully pulled funds on-chain!
                  txHash:
                    type: string
        '202':
          description: >
            Submitted but not confirmed before the poll timeout.
            `next_billing_date` is unchanged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Transaction submitted but not yet confirmed; check back later
                  txHash:
                    type: string
        '400':
          description: >
            Request failed validation, or `merchant_secret` is not a valid
            Stellar secret key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validation:
                  summary: Field failed validation
                  value:
                    error: 'Invalid input on subscription_id: subscription_id must be a valid UUID'
                invalidSecret:
                  summary: Secret is not a Stellar secret key
                  value:
                    error: 'Invalid merchant_secret: not a valid Stellar secret key'
        '401':
          description: Secret does not match the plan owner's wallet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Merchant secret does not match the plan owner's address
        '404':
          description: Subscription not found, or the plan's merchant no longer exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                subscription:
                  value:
                    error: Subscription not found
                merchant:
                  value:
                    error: Merchant not found
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          description: The transaction failed on-chain. The subscription is marked `past_due`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Transaction failed on-chain
                  txHash:
                    type: string
components:
  schemas:
    Plan:
      type: object
      properties:
        id:
          type: string
          format: uuid
        merchant_id:
          type: string
          format: uuid
        name:
          type: string
        usdc_amount:
          type: integer
        interval_seconds:
          type: integer
        created_at:
          type: string
          format: date-time
    Subscription:
      type: object
      properties:
        id:
          type: string
          format: uuid
        plan_id:
          type: string
          format: uuid
        customer_wallet_address:
          type: string
        status:
          type: string
          enum: [active, cancelled, past_due]
        next_billing_date:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        error:
          type: string
  responses:
    BadRequest:
      description: >
        Request failed validation. The message names the first field that
        failed, as `Invalid input on <field>: <reason>`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            wrongFormat:
              summary: Field has the wrong format
              value:
                error: 'Invalid input on merchant_id: merchant_id must be a valid UUID'
            missingField:
              summary: Field is missing
              value:
                error: 'Invalid input on name: Invalid input: expected string, received undefined'
    PlanNotFound:
      description: Plan not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Plan not found
    ServerError:
      description: >
        Server misconfiguration, database error or Soroban error. The message
        is passed through.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notConfigured:
              summary: Supabase env vars are missing
              value:
                error: Supabase client not initialized
